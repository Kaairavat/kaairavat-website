<!DOCTYPE html>
<html>
<head>
  <title>Kaairavat Rentals</title>
  <style>
    body {font-family: Arial; text-align:center; background:#f5f5f5;}
    .box {background:white; padding:20px; margin:20px; border-radius:10px;}
    button {padding:12px 20px; background:green; color:white; border:none;}
  </style>
</head>

<body>

<h1>🚖 Kaairavat Rentals</h1>
<p>Instant Cab Booking in Chhattisgarh</p>

<div class="box">
<h2>🔍 Check Fare</h2>

<input id="pickup" placeholder="Pickup City"><br><br>
<input id="drop" placeholder="Drop City"><br><br>

<button onclick="getPrice()">Check Price</button>

<h3 id="price"></h3>

<button onclick="goBooking()">Book Now</button>
</div>

<div class="box">
<h2>🔥 Popular Routes</h2>
<p>Bilaspur → Raipur ₹2000</p>
<p>Bilaspur → Raigarh ₹2500</p>
<p>Bilaspur → Jagdalpur ₹6000</p>
</div>

<div class="box">
<h2>💎 Why Us</h2>
<p>No Commission | Direct Owner | Best Price</p>
</div>

<script>
function getPrice(){
  let p = document.getElementById("pickup").value;
  let d = document.getElementById("drop").value;
  let price = 3000;

  if(p=="Bilaspur" && d=="Raipur"){price=2000;}
  else if(p=="Bilaspur" && d=="Raigarh"){price=2500;}
  else if(p=="Bilaspur" && d=="Jagdalpur"){price=6000;}

  document.getElementById("price").innerText = "₹ " + price;
}

function goBooking(){
  window.location.href="booking-system.html";
}
</script>

</body>
</html>
